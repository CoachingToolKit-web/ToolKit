<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coaching Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --ink:#1C2B39; --ink-soft:#4A5B6B; --paper:#FFFFFF; --bg:#EDF1F4; --panel:#F6F8FA;
  --line:#CBD5DE; --teal:#0E6B6B; --teal-soft:#DCEEEE; --gold:#E0A21A; --danger:#B3261E;
  --shadow:0 1px 2px rgba(28,43,57,.06),0 8px 24px rgba(28,43,57,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#E6ECF1; --ink-soft:#A9B7C4; --paper:#18222C; --bg:#0F171F; --panel:#1E2A35;
  --line:#34434F; --teal:#5CC2C0; --teal-soft:#1D3A3D; --gold:#EBB53F; --danger:#F2867E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ink:#E6ECF1; --ink-soft:#A9B7C4; --paper:#18222C; --bg:#0F171F; --panel:#1E2A35;
  --line:#34434F; --teal:#5CC2C0; --teal-soft:#1D3A3D; --gold:#EBB53F; --danger:#F2867E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#F1F4F7;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .rail{background:#0A1117} }
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;line-height:1.05;padding:0 8px 18px;border-bottom:3px solid var(--gold);margin-bottom:12px}
.brand small{display:block;font-family:Figtree,sans-serif;font-weight:500;font-size:12.5px;color:#AFC0CE;margin-top:6px}
.rail .group{font-size:12.5px;color:#AFC0CE;padding:14px 8px 4px}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:#E8EEF3;cursor:pointer}
.navbtn:hover{background:rgba(255,255,255,.08)}
.navbtn.on{background:#F1F4F7;color:#1C2B39;font-weight:600}
.navbtn .count{font-size:12px;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:99px}
.navbtn.on .count{background:var(--gold);color:#1C2B39}

main{padding:28px clamp(14px,4vw,48px) 120px;min-width:0}
.topline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;max-width:900px;margin:0 auto 16px}
.status{font-size:13px;color:var(--ink-soft)}
.status.err{color:var(--danger)}
.sheet{max-width:900px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:clamp(18px,4vw,40px)}
.sheet h1{font-size:clamp(22px,3.2vw,30px);font-weight:800;padding-bottom:10px;border-bottom:3px solid var(--gold)}
.sheet .sub{color:var(--ink-soft);font-style:italic;margin:8px 0 0;font-size:14px}
.note{color:var(--ink-soft);font-size:14px;margin:14px 0 0}

.fields{display:grid;gap:12px 18px;margin-top:20px}
.fields.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.fields.c2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-soft)}
input[type=text],input[type=date],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px;font-weight:400;color:var(--ink);min-height:38px}
textarea{resize:vertical;line-height:1.45;overflow:hidden}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);background:var(--paper)}

.section{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.section h2{font-size:19px;font-weight:800;display:flex;gap:12px;align-items:baseline}
.section h2 .n{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:14px}
.section h2 .s{font-family:Figtree,sans-serif;font-weight:500;font-size:15px;color:var(--ink-soft)}
.prompts{margin:10px 0 0;padding-left:20px;color:var(--ink-soft);font-size:14px}
.prompts li{margin:2px 0}
.ta{margin-top:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;background:var(--panel)}
.chk:has(input:checked){border-color:var(--teal);background:var(--teal-soft);font-weight:600}
.chk input{accent-color:var(--teal)}
.other{margin-top:8px;max-width:420px}

.gridwrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:6px}
table.g{border-collapse:collapse;width:100%;min-width:560px}
table.g th{background:var(--panel);text-align:left;font-size:13px;padding:8px;border-bottom:1px solid var(--line)}
table.g td{border-top:1px solid var(--line);padding:6px;vertical-align:top}
table.g td.lab{font-weight:700;width:52px;text-align:center;padding-top:14px}
table.g textarea,table.g input,table.g select{background:transparent;border-color:transparent;min-height:36px}
table.g textarea:hover,table.g input:hover,table.g select:hover{border-color:var(--line)}
td.x{width:34px}
.xbtn{border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:18px;padding:6px}
.xbtn:hover{color:var(--danger)}

input[type=time]{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px;min-height:38px}
.rates{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.rate{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--paper)}
.rate.r0{border-left-color:#9AA7B3}.rate.r1{border-left-color:#C8553D}.rate.r2{border-left-color:var(--gold)}.rate.r3{border-left-color:#3E9A6E}.rate.r4{border-left-color:var(--teal)}
.rh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.rh .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px}
.rh .it{font-size:14.5px;line-height:1.35}
.rh .lk{font-size:13px;color:var(--ink-soft);margin-top:4px}
.rh select{width:auto;min-width:170px}
.rate textarea{margin-top:10px;min-height:36px}
@media (max-width:640px){.rh{grid-template-columns:auto 1fr}.rh select{grid-column:1/-1;width:100%}}
.ct td.lab{width:auto;text-align:left;font-weight:700;padding:10px}
.gcard{border:1px solid var(--line);border-radius:8px;margin-top:14px;overflow:hidden}
.gcard .gh{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.gcard .gh b{font-size:15px}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff;background:#C8553D;white-space:nowrap}
.pill.p2{background:#B07A06}
.gb{padding:12px 14px}
.gb h4{margin:12px 0 4px;font-size:13.5px;color:var(--ink-soft)}
.gb h4:first-child{margin-top:0}
.strat{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:14px;cursor:pointer}
.strat input{margin-top:3px;accent-color:var(--teal);flex:none}
.gb details{margin-top:10px;font-size:14px}
.gb summary{cursor:pointer;font-weight:600;color:var(--teal)}
.gb details ul{margin:6px 0 0;padding-left:20px;color:var(--ink-soft)}
.glows{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--teal-soft);font-size:14px}
.glows ul{margin:6px 0 0;padding-left:20px}
.clab{font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:14px}
.rate.wyes{border-left-color:var(--teal)}.rate.wno{border-left-color:#9AA7B3}
.rate .it{font-size:15px;line-height:1.4}
.tags{margin-top:6px}.tag.big3{background:#FBEFD2;color:#8A5A00}
.seen{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seen input{accent-color:var(--teal)}
details.guide{margin-top:8px;font-size:13.5px}
details.guide summary{cursor:pointer;color:var(--teal);font-weight:600}
details.guide dl{margin:6px 0 0}details.guide dt{font-weight:700;margin-top:6px}details.guide dd{margin:2px 0 0;color:var(--ink-soft)}
.scans{display:grid;gap:12px;margin-top:12px}
.scan{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.scan .clab{width:100%;margin-top:0}
.scan input{width:80px}
.scan .pct{color:var(--teal);font-size:15px}
.trends{margin:10px 0 6px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.trends h3{font-size:17px;margin-bottom:4px}
.trow{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 84px;gap:10px;align-items:center;font-size:13.5px;margin-top:8px}
.tbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.tbar i{display:block;height:100%;background:var(--teal)}
.aibar{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{color:#0F171F} }
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.addrow{margin-top:10px}

.bar{position:fixed;left:250px;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px clamp(14px,4vw,48px) calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;z-index:5}
.bar .inner{max-width:900px;width:100%;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar .spacer{flex:1}

.saved h1{font-size:28px;font-weight:800}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.filters input{max-width:280px}
.filters label.d{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);font-weight:600}
.filters label.d input{width:auto}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;margin:4px 0 8px;background:var(--teal-soft);border-radius:8px}
.bulk .lead{flex:1;min-width:200px;font-size:14px}
.bulk .lead b{font-weight:700}
.filters select{max-width:240px}
.rec{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.rec .t{font-weight:700}
.rec .m{font-size:13px;color:var(--ink-soft)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal);margin-right:6px}
.rec .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:28px 0;color:var(--ink-soft)}
.drivemsg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 8px 10px 16px;border-radius:8px;font-size:14px;z-index:11;max-width:min(560px,92vw);display:flex;gap:8px;align-items:center}
.drivemsg a{color:var(--teal);font-weight:700;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw}
.toast.on{opacity:1}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:4px;z-index:6;top:env(safe-area-inset-top,0px)}
  .brand,.rail .group{display:none}
  .navbtn{white-space:nowrap;width:auto}
  .bar{left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Forms"></nav>
  <main id="main"></main>
</div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const ME = "__ME__";
const NAMEKEY="coachingToolkit.name";
function myName(){try{return localStorage.getItem(NAMEKEY)||""}catch{return ""}}
const NOTES = "Notes / Evidence / Reflection";
const CATS = ["Planning Support","Data Analysis","Resource Development","Modeling/Co-Teaching","Technology Integration","Assessment Support","PLC Facilitation","Literacy/Content Support","Follow-Up Conference","Other"];

const SCALE=[["0","0 - Not observed"],["1","1 - Not evident"],["2","2 - Somewhat evident"],["3","3 - Evident"],["4","4 - Very evident"]];
const SCALE_LABEL={"0":"Not observed","1":"Not evident","2":"Somewhat evident","3":"Evident","4":"Very evident"};
const SDI=[
{n:8,code:"CI-2",title:"The instructor implements a clear, subject-area appropriate instructional framework with a sense of urgency about how time is used and incorporates smooth transitions.",
 look:"The lesson moves through each element of an appropriate instructional framework with a sense of urgency and smooth transitions (Opening, Work Session, Closing in ELA/social studies; Engage, Explore, Apply, Reflect in math; 5E in science).",
 teacher:{"Preparedness and Structure":["Show a clear understanding of the instructional framework, moving through each element with purpose and urgency.","Establish and communicate clear expectations for each phase of the lesson.","Implement structures and routines aligned with the lesson framework so instruction follows a logical sequence."],
  "Effective Transition Management":["Model and refer to established procedures for moving between activities.","Use timers or verbal cues to signal transitions and keep a sense of urgency.","Keep transitions tied to the lesson structure (e.g., whole group to small group) and help students understand the process."],
  "Instructional Delivery and Monitoring":["Deliver instruction coherently using modeling, discourse, and activators.","Use questioning to probe understanding during the opening, work session, and closing.","Monitor independent and small-group work, giving timely feedback."],
  "Data-Driven Grouping and Feedback":["Use data to group students for differentiated instruction during the work period.","Give individualized feedback during and after the lesson toward mastery of the learning targets.","Use formative assessments to gather data and adjust instruction."]},
 students:["Stay focused and on task in each phase of the lesson","Ask and answer questions in the opening; engage in independent or collaborative work","Reflect during the closing with a formative check (e.g., ticket-out-the-door)","Move smoothly between activities and phases","Use resources and tools independently during the work period","Use rubrics, reflection sheets, or graphic organizers to track progress"],
 artifacts:["Lesson plans showing the framework (Opening, Work Session, Closing) aligned to standards","Framework/agenda posted in the room","Prepared, accessible materials","Do Now activities, exit tickets, formative checks","Teacher feedback on student work","Data trackers and group activity records","Posted expectations and transition procedures"]},
{n:9,code:"CI-2",title:"The instructor communicates clear learning targets aligned to the rigor and intent of the standard addressed.",
 look:"Verbalized learning targets for mastery of the lesson are referred to often and aligned to the rigor and intent of the standard. Academic vocabulary is used and highlighted.",
 teacher:{"Verbalized and Posted Learning Targets":["Clearly state and explain the learning target at the beginning of the lesson.","Repeat and refer to the learning target throughout the lesson.","Display the learning target visually in the classroom."],
  "Use of Academic Vocabulary":["Introduce and emphasize key vocabulary terms.","Provide definitions and context for academic vocabulary.","Encourage students to use academic vocabulary in their responses."],
  "Alignment to Standards":["Design activities and assessments that match the rigor and intent of the standard.","Explain how lesson activities connect to the standard.","Use examples and non-examples to clarify the standard's expectations."],
  "Instructional Strategies":["Use a variety of teaching methods for different learner needs.","Use formative assessments to check for understanding.","Give timely, specific feedback to students."]},
 students:["Explain the learning target in their own words","Refer to the learning target during discussions and activities","Use academic vocabulary in speaking and writing","Identify and define new vocabulary","Track progress toward the target with a rubric","Set personal goals related to the target"],
 artifacts:["Lesson plans with learning targets, DOK levels, and ALDs","Posted learning targets and key vocabulary in student-friendly language","Student work samples showing mastery of the target","Assignments using academic vocabulary","Rubrics and scoring guides aligned to the target","Documentation of feedback used to guide instruction"]},
{n:10,code:"CI-2",title:"The instructor communicates success criteria aligned to the rigor and intent of the standard addressed.",
 look:"Verbalized success criteria so students understand how to master the lesson are referred to often and aligned to the rigor and intent of the standard.",
 teacher:{"Verbalized and Posted Success Criteria":["State the success criteria at the beginning of the lesson.","Explain the success criteria using content-specific vocabulary and modeling.","Refer back to the success criteria throughout the lesson."],
  "Use of Academic Vocabulary":["Introduce key vocabulary critical to understanding the lesson.","Give definitions and real-life context for vocabulary.","Unpack the success criteria by underlining verbs or explaining complex vocabulary."],
  "Alignment to Standards/ALDs":["Design activities and assessments that match the rigor and intent of the standard.","Use exemplars and non-examples to clarify the success criteria.","Break the standard into what students need to know, understand, and do."],
  "Assessment Strategies":["Use formative and summative assessments regularly.","Use rubrics that include DOK levels and ALDs aligned to the success criteria.","Give timely, explicit feedback aligned to the standard and success criteria."],
  "Instructional Scaffolding":["Model how students can apply the success criteria to their work.","Scaffold students toward the success criteria, adjusting support to student needs."]},
 students:["Explain the success criteria to others when asked","Justify their work using rubrics and exemplars","Reference the success criteria while working","Compare their work to the rubric","Use academic vocabulary from the success criteria"],
 artifacts:["Success criteria verbalized and posted","Lesson plans with clearly defined success criteria and DOK levels","Posted exemplars with teacher feedback","Rubrics with DOK levels and ALDs","Student self-assessment tools (rubrics, checklists)","Curriculum maps linking standards, success criteria, activities, and assessments"]},
{n:11,code:"CI-2",title:"The instructor uses high-yield instructional practices explicitly aligned to the rigor and intent of the standard addressed.",
 look:"Similarities and differences, summarizing and note-taking, reinforcing effort, practice, non-linguistic representations, cooperative learning, prior knowledge, hypotheses, cues, questions, advance organizers, examples, explanations, representations, or models.",
 teacher:{"Posting Learning Targets and Success Criteria":["Clearly state and display the learning target and success criteria throughout the lesson.","Refer back to them during instruction to reinforce expectations."],
  "Engaging Students in Active Learning":["Use research-based strategies (small groups, similarities and differences, summarizing, cooperative learning).","Use real-life examples and interdisciplinary connections."],
  "Building Upon Prior Knowledge":["Connect new concepts to students' existing knowledge and skills.","Check prior knowledge at the start of the lesson to tailor instruction."],
  "Reinforcing Learning Goals":["Use exemplars and non-examples to clarify expectations and model high-quality work."],
  "Using Instructional Technology":["Integrate instructional technology beyond mandated programs.","Use tools that support different learning styles and modalities."],
  "Developing Higher-Order Thinking":["Use varied questioning techniques to promote higher-order thinking.","Engage students in generating hypotheses, analyzing, and evaluating."],
  "Providing Scaffolding":["Offer differentiated support for varied learners.","Use graphic organizers and models to scaffold learning."],
  "Monitoring and Providing Feedback":["Check in regularly and give in-the-moment feedback.","Use rubrics and other tools to guide student progress."]},
 students:["Explain the success criteria and how it relates to the lesson","Engage in cooperative learning, discussion, and problem-solving","Self-assess with rubrics, exemplars, and feedback","Represent learning with graphic organizers or non-linguistic representations","Give peer feedback and use academic discourse"],
 artifacts:["Lesson plans referencing DOK, ALDs, and evidence-based practices","Posted learning targets, success criteria, and DOK charts","Anchor charts, graphic organizers, exemplar work","Student reflections and self-assessments","Evidence of technology integration","Posted exemplars and non-examples"]},
{n:12,code:"CI-3",title:"The instructor uses formative assessments (oral or written) to monitor learning and to inform instruction.",
 look:"Effective Q&A, quizzes, ticket-out-the-door slips, think-pair-share, journaling, clickers, interactive assessment activities that drive instruction, or distributive use of success criteria.",
 teacher:{"Utilizing Formative Assessments":["Use Q&A, quizzes, think-pair-share, exit tickets, and journaling to monitor understanding.","Use interactive tools (clickers, digital platforms) to adjust instruction in real time.","Use quick checks such as thumbs up/down or hand signals."],
  "Questioning and Feedback":["Question intentionally to check understanding and adjust instruction.","Give timely, specific, targeted feedback toward mastery of the learning target.","Use a questioning strategy that lets every student be heard."],
  "Planning and Preparation":["Display and verbalize the learning target and success criteria.","Plan a structured student response system so all students show understanding.","Build a questioning matrix, ALDs, and standards into lesson plans."],
  "Adjusting Instruction Based on Data":["Use formative data to decide next steps for individual students.","Analyze trends in student work to differentiate instruction.","Use frameworks that allow ongoing assessment and responsive teaching."]},
 students:["Respond orally or in writing during formative checks","Pose questions and participate in think-pair-share","Use graphic organizers, self-reflections, or test corrections","Set learning goals; use interactive notebooks","Self-assess with exit tickets or reflection journals"],
 artifacts:["Lesson plans with formative assessment planning","Quizzes, exit tickets, graphic organizers","Item analyses and data review protocols","Interactive digital media (Nearpod, Quizizz, Seesaw)","Documentation of feedback used to adjust instruction","Pre- and post-assessment data"]},
{n:13,code:"SLE-1",title:"The instructor establishes and implements rules, schedules, practices, and procedures within the classroom to maximize student learning.",
 look:"Classroom rules and procedures are evident, resulting in a positive learning environment. Transitions, routines, and procedures are executed in an orderly and efficient manner, promoting positive relationships and classroom culture.",
 teacher:{"Clear Expectations and Consistency":["Consistently communicate and reinforce rules, routines, and expectations that are visible to all students.","Carry out procedures consistently and model desired behaviors and transitions.","Communicate expectations verbally and non-verbally and reinforce with positive reminders."],

  if(!v) return "";

  let s=`${MONTHS[+m[2]-1]} ${+m[3]}, ${m[1]}`;
  if(m[4]){let h=+m[4];const ap=h>=12?"PM":"AM";h=h%12||12;s+=` ${h}:${m[5]} ${ap}`}
  return s;
}

const LSSET="coachingToolkit.settings";
const local = {
  async getSettings(){try{return JSON.parse(localStorage.getItem(LSSET)||"{}")}catch{return {}}},
  async setSettings(o){try{localStorage.setItem(LSSET,JSON.stringify(o))}catch{}},
  async save(r){const o=lsRead();o[r.id]=r;if(!lsWrite(o))throw new Error("storage");emitLocal()},
  async remove(id){const o=lsRead();delete o[id];lsWrite(o);emitLocal()}
};
function emitLocal(){records=Object.values(lsRead()).sort((a,b)=>b.updatedAt-a.updatedAt);onRecords()}

const storeP=(async()=>{
  try{
    const [db,user]=await Promise.all([cap("db"),cap("user")]);
    const id=user?await user.id():null;
    if(db&&id){
      const col=db.doc("data/users/"+id+"/toolkit").collection("records");
      col.orderBy("updatedAt","desc").onSnapshot(s=>{records=s.docs.map(d=>d.data());onRecords()},
        e=>{setStatus("Couldn't load saved forms. Reload the page to try again.",true)});
      storeKind="cloud";
      const sref=db.doc("data/users/"+id+"/toolkit");
      return {async save(r){await col.doc(r.id).set(r)},async remove(i){await col.doc(i).delete()},
        async getSettings(){const d=await sref.get();return d.exists?{...d.data()}:{}},
        async setSettings(o){await sref.set(o)}};
    }
  }catch(e){}
  storeKind="local"; emitLocal(); return local;
})();

/* ---------- state ---------- */
let view="form", cur=null, dirty=false, saveTimer=null, saving=Promise.resolve();
let filter={form:"",q:"",from:"",to:""}, confirmDel=null;

function newRecord(formId){cur={id:uid(),form:formId,values:defaults(FORM[formId]),createdAt:Date.now(),updatedAt:Date.now()};dirty=false}
function setStatus(msg,err){const s=$("#status");if(s){s.textContent=msg;s.classList.toggle("err",!!err)}}

function scheduleSave(){dirty=true;setStatus("Editing…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}
function flush(){
  clearTimeout(saveTimer); if(!dirty||!cur) return saving;
  dirty=false; const snap=JSON.parse(JSON.stringify({...cur,updatedAt:Date.now()}));
  saving=saving.then(async()=>{
    try{const s=await storeP;await s.save(snap);setStatus(storeKind==="cloud"?"All changes saved":"Saved on this device")}
    catch(e){dirty=true;setStatus(e&&e.code==="quota_exceeded"?"Storage is full. Delete old forms to keep saving.":"Couldn't save. Your changes are kept on screen; keep typing to retry.",true)}
  });
  return saving;
}

function teacherList(){return [...new Set(records.flatMap(r=>{const v=r.values||{};return [v.teacher,...(v.entries||[]).map(e=>e.teacher)]}).filter(Boolean))].sort()}

function inputHTML(f,val,attrs){
  const t=f.input||"text";
  if(t==="textarea") return `<textarea rows="${f.rows||2}" ${attrs}>${esc(val)}</textarea>`;
  if(t==="select") return `<select ${attrs}><option value=""></option>${f.options.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  return `<input type="${t}" value="${esc(val)}" ${f.list?'list="teachers"':""} ${attrs}>`;
}
function blockHTML(b,v){
  switch(b.type){
    case "fields": return `<div class="fields ${b.cols===2?"c2":""}">${b.fields.map(f=>`<label class="f">${esc(f.label)}${inputHTML(f,v[f.key]||"",`data-key="${f.key}"`)}</label>`).join("")}</div>`;
    case "textarea": { const lab=b.label===undefined?NOTES:b.label; return `<label class="f ta">${esc(lab)}<textarea rows="4" data-key="${b.key}" aria-label="${esc(lab||"Notes")}">${esc(v[b.key]||"")}</textarea></label>`; }
    case "note": return `<p class="note">${esc(b.text)}</p>`;
    case "checks": { const sel=v[b.key]||[];
      return `${b.showLabel?`<div class="clab">${esc(b.label)}</div>`:""}<div class="checks" role="group" aria-label="${esc(b.label)}">${b.options.map(o=>`<label class="chk"><input type="checkbox" data-check="${b.key}" value="${esc(o)}" ${sel.includes(o)?"checked":""}>${esc(o)}</label>`).join("")}</div>
      ${b.other?`<div class="other"><input type="text" placeholder="If other, describe" data-key="${b.other}" value="${esc(v[b.other]||"")}" aria-label="Other role"></div>`:""}`; }
    case "grid": { const rows=v[b.key]||[];
      return `<div class="gridwrap"><table class="g"><thead><tr>${b.rowLabels?`<th>${esc(b.labelHead)}</th>`:""}${b.columns.map(c=>`<th ${c.w?`style="width:${c.w}px"`:""}>${esc(c.label)}</th>`).join("")}${b.dynamic?"<th></th>":""}</tr></thead><tbody>
      ${rows.map((r,i)=>`<tr>${b.rowLabels?`<td class="lab">${esc(b.rowLabels[i])}</td>`:""}${b.columns.map(c=>`<td>${inputHTML(c,r[c.key]||"",`data-grid="${b.key}" data-row="${i}" data-col="${c.key}" aria-label="${esc(c.label)} row ${i+1}"`)}</td>`).join("")}${b.dynamic?`<td class="x"><button class="xbtn" data-delrow="${b.key}:${i}" aria-label="Remove row ${i+1}">×</button></td>`:""}</tr>`).join("")}
      </tbody></table></div>${b.dynamic?`<button class="btn small addrow" data-addrow="${b.key}">Add row</button>`:""}`; }
    case "ratings": { const r=v.ratings||{}, ev=v.evidence||{};
      return `<div class="rates">${SDI.map(i=>`<div class="rate r${r[i.n]||""}"><div class="rh"><span class="num">${i.n}</span><div><div class="it"><b>${esc(i.code)}:</b> ${esc(i.title)}</div><div class="lk">${esc(i.look)}</div></div>
      <select data-map="ratings" data-mk="${i.n}" aria-label="Rating for indicator ${i.n}"><option value="">Rate</option>${SCALE.map(([k,l])=>`<option value="${k}" ${r[i.n]===k?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
      <textarea rows="1" placeholder="Evidence observed (optional)" data-map="evidence" data-mk="${i.n}" aria-label="Evidence for indicator ${i.n}">${esc(ev[i.n]||"")}</textarea></div>`).join("")}</div>`; }
    case "coteach": { const c=v.coteach||{};
      return `<div class="gridwrap"><table class="g ct"><thead><tr><th>Model</th><th>Description</th><th style="width:120px">Rating</th></tr></thead><tbody>${COTEACH.map(([k,n,d])=>`<tr><td class="lab">${k}. ${esc(n)}</td><td style="font-size:14px;padding:10px">${esc(d)}</td><td><select data-map="coteach" data-mk="${k}" aria-label="Rating for ${esc(n)}"><option value=""></option>${["1","2","3","4"].map(x=>`<option ${c[k]===x?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>`; }
    case "growth": return `<div id="growth">${growthHTML(v)}</div>`;
    case "walkLooks": { const seen=v.seen||{}, ev=v.wev||{};
      return WALK.map(g=>`<section class="section"><h2><span>${esc(g.group)}</span></h2>${g.items.map(i=>`<div class="rate w${seen[i.k]||""}">
        <div class="it">${esc(i.text)}</div>
        <div class="tags"><span class="tag">SDI #${i.sn}: ${esc(i.sdi)}</span>${i.big3?`<span class="tag big3">Big 3: ${esc(i.big3)}</span>`:""}</div>
        <div class="seen" role="radiogroup" aria-label="Seen?"><label class="chk"><input type="radio" name="seen-${i.k}" value="yes" data-map="seen" data-mk="${i.k}" ${seen[i.k]==="yes"?"checked":""}>Yes</label><label class="chk"><input type="radio" name="seen-${i.k}" value="no" data-map="seen" data-mk="${i.k}" ${seen[i.k]==="no"?"checked":""}>Not this visit</label></div>
        <textarea rows="1" placeholder="What I saw or heard (evidence only, no judgments)" data-map="wev" data-mk="${i.k}" aria-label="Evidence">${esc(ev[i.k]||"")}</textarea>

    case "scan": { const sc=(a,b,l)=>`<div class="scan"><div class="clab">${l}</div><input type="number" min="0" inputmode="numeric" data-key="${a}" value="${esc(v[a]||"")}" aria-label="${l} engaged"> engaged of <input type="number" min="0" inputmode="numeric" data-key="${b}" value="${esc(v[b]||"")}" aria-label="${l} total"> students <b class="pct" data-pct="${a}">${pct(v[a],v[b])!==null?pct(v[a],v[b])+"%":""}</b></div>`;
      return `<div class="scans">${sc("s1e","s1n","Scan 1 (first few minutes)")}${sc("s2e","s2n","Scan 2 (near the end of the visit)")}</div>`; }
    case "walkTools": return `<div class="aibar"><button class="btn" data-act="walkPre">Start a preconference from this walk</button></div>`;
    case "summary": return `<div class="aibar"><button class="btn" data-act="toPre">Start a preconference from this observation</button></div>
      <label class="f ta"><span class="sr" style="position:absolute;left:-9999px">Coaching summary</span><textarea id="summaryBox" rows="6" data-key="summary" placeholder="Strengths, areas for growth, recommended strategies, and next steps">${esc(v.summary||"")}</textarea></label>`;
    case "section": return `<section class="section"><h2>${b.n?`<span class="n">${b.n}</span>`:""}<span>${esc(b.title)}${b.sub?` <span class="s">${esc(b.sub)}</span>`:""}</span></h2>
      ${b.prompts?`<ul class="prompts">${b.prompts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}${b.blocks.map(x=>blockHTML(x,v)).join("")}</section>`;
  }
  return "";
}
function growthHTML(v){
  const r=v.ratings||{}, st=v.strategies||{}, nx=v.nextSteps||{};
  if(!Object.values(r).some(Boolean)) return `<p class="empty">Rate the indicators above. Anything rated 1 or 2 appears here with strategies from the SDI Coaching Tool, so you can pick what to recommend.</p>`;
  const g=growthList(v), s=strengthList(v); let h="";
  if(s.length) h+=`<div class="glows"><b>Strengths (rated 3 or 4)</b><ul>${s.map(i=>`<li>#${i.n} ${esc(i.short)}: ${esc(SCALE_LABEL[r[i.n]])}</li>`).join("")}</ul></div>`;
  if(!g.length) h+=`<p class="empty">No indicators are rated 1 or 2, so there are no growth areas to plan for yet.</p>`;
  h+=g.map(i=>{const sel=st[i.n]||[];return `<div class="gcard"><div class="gh"><span class="pill p${r[i.n]}">Rated ${r[i.n]}</span><b>#${i.n} ${esc(i.short)}</b></div><div class="gb">
    <h4>Teacher strategies to recommend (from the SDI Coaching Tool)</h4>
    ${Object.entries(i.teacher).map(([cat,bs])=>`<div style="margin-top:8px"><div style="font-weight:700;font-size:13.5px">${esc(cat)}</div>${bs.map(b=>`<label class="strat"><input type="checkbox" data-mapcheck="strategies" data-mk="${i.n}" value="${esc(b)}" ${sel.includes(b)?"checked":""}><span>${esc(b)}</span></label>`).join("")}</div>`).join("")}
    <details><summary>Student behaviors to look for</summary><ul>${i.students.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
    <details><summary>Artifacts to collect as evidence</summary><ul>${i.artifacts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
    <label class="f ta">Coaching next step<textarea rows="2" data-map="nextSteps" data-mk="${i.n}">${esc(nx[i.n]||"")}</textarea></label></div></div>`}).join("");
  return h;
}
function grow(t){t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}

function filtered(){const q=filter.q.trim().toLowerCase();
  return records.filter(r=>{const d=recISO(r);return (!filter.form||r.form===filter.form)&&(!q||recTitle(r).toLowerCase().includes(q)||JSON.stringify(r.values).toLowerCase().includes(q))&&(!filter.from||d>=filter.from)&&(!filter.to||d<=filter.to)})}

/* ---------- SDI helpers ---------- */
let aiCtl=null, aiConfirm=false;
function aiPrompt(v){
  const r=v.ratings||{}, ev=v.evidence||{}, st=v.strategies||{}, nx=v.nextSteps||{}, co=v.coteach||{};
  const ratings=SDI.map(i=>`#${i.n} ${i.short} (${i.code}): ${r[i.n]?r[i.n]+" - "+SCALE_LABEL[r[i.n]]:"not rated"}${ev[i.n]?" | Evidence: "+ev[i.n]:""}`).join("\n");
  const growth=growthList(v).map(i=>`#${i.n} ${i.short} (rated ${r[i.n]})\nSDI Coaching Tool teacher behaviors:\n${Object.entries(i.teacher).map(([c,b])=>"- "+c+": "+b.join(" ")).join("\n")}\nStrategies the coach selected: ${(st[i.n]||[]).join(" ")||"none yet"}\nCoach's planned next step: ${nx[i.n]||"none yet"}`).join("\n\n")||"None (no indicators rated 1 or 2).";
  const cot=COTEACH.filter(c=>co[c[0]]).map(c=>`${c[1]}: ${co[c[0]]}`).join("; ")||"No co-teacher present.";
  return `You are helping an instructional coach write a coaching summary after a classroom observation using the Georgia DOE SDI Classroom Observation Form. Scale: 0 not observed, 1 not evident, 2 somewhat evident, 3 evident, 4 very evident.

Teacher: ${v.teacher||"(not given)"}
Grade and subject: ${v.gradeSubject||"(not given)"}
Observation date: ${fmtDate(v.date)||"(not given)"}

Ratings:
${ratings}

Co-teaching: ${cot}
Observer notes: ${v.notes||"none"}

Growth areas with SDI Coaching Tool guidance:
${growth}

Write a coaching summary the coach can share with the teacher. Use a partnership coaching tone in the spirit of Jim Knight's Impact Cycle: specific, evidence-based, non-evaluative, and encouraging. Plain text only, no markdown symbols such as # or *. Put each of these headings on its own line, each followed by short bullets that start with "- ":
Strengths observed
Areas for growth
Recommended strategies
Suggested student-impact goal
Next steps
Evidence to collect at the next visit

For recommended strategies, draw from the SDI Coaching Tool teacher behaviors listed above and favor the ones the coach selected. The student-impact goal should be one measurable goal. Use only the information above; do not invent classroom details, and do not comment on indicators that were not rated. Keep it under 350 words.`;
}
async function draftSummary(){
  if(aiCtl){aiCtl.abort();return}
  const rec=cur, v=rec.values, box=$("#summaryBox"), btn=$("#aiBtn");
  if(!Object.values(v.ratings||{}).some(Boolean)){toast("Rate at least one indicator first.");return}
  if(box.value.trim()&&!aiConfirm){aiConfirm=true;btn.textContent="Replace my summary?";setTimeout(()=>{aiConfirm=false;if(!aiCtl&&$("#aiBtn"))$("#aiBtn").textContent="Draft summary with Claude"},5000);return}
  aiConfirm=false;
  const sample=await sampleP; if(!sample){toast("Drafting with Claude isn't available in this view.");return}
  const prev=box.value; aiCtl=new AbortController(); btn.textContent="Stop"; box.value="Thinking…"; grow(box);
  let out=prev;
  try{ const res=await sample(aiPrompt(v),{signal:aiCtl.signal,onText:({text})=>{box.value=text;grow(box)}}); out=res.text; }
  catch(e){ out=(e&&e.text)||prev; if(!e||e.code!=="cancelled") toast(e&&e.code==="not_granted"?"Claude drafting wasn't allowed. You can still write the summary yourself.":e&&e.code==="rate_limited"?"Too many requests right now. Try again in a minute.":"Couldn't draft the summary. Try again."); }
  finally{ aiCtl=null; rec.values.summary=out; if(cur===rec){const b=$("#summaryBox");if(b){b.value=out;grow(b)} const bb=$("#aiBtn");if(bb)bb.textContent="Draft summary with Claude"; scheduleSave();} }
}
async function toPreconference(){
  await flush(); const v=cur.values, r=v.ratings||{}, g=growthList(v), s=strengthList(v);
  newRecord("pre"); const p=cur.values;
  p.teacher=v.teacher||""; p.classContent=v.gradeSubject||"";
  const d=new Date(); p.date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  p.s1=[`SDI observation${v.date?" on "+fmtDate(v.date):""}.`,
    ...g.map(i=>`- #${i.n} ${i.short}: rated ${r[i.n]} (${SCALE_LABEL[r[i.n]]})${v.evidence?.[i.n]?". Evidence: "+v.evidence[i.n]:""}`),
    s.length?`Strengths to preserve: ${s.map(i=>i.short).join(", ")}.`:""].filter(Boolean).join("\n");
  const strat=g.flatMap(i=>(v.strategies?.[i.n]||[]).map(x=>`- ${x}`));
  if(strat.length) p.s3="Strategies from the SDI Coaching Tool:\n"+strat.join("\n");
  if(g.length) p.obsFocus=g.map(i=>i.short).join(", ");
  dirty=true; view="form"; render(); window.scrollTo(0,0); flush(); toast("Preconference started from the observation");
}

async function walkToPreconference(){
  await flush(); const v=cur.values, seen=v.seen||{};
  newRecord("pre"); const p=cur.values;
  p.teacher=v.teacher||""; p.classContent=v.course||"";
  const d=new Date(); p.date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const seenList=WALK_ITEMS.filter(i=>seen[i.k]==="yes").map(i=>i.sdi);
  p.s1=[`Eagle Eyes Learning Walk${v.date?" on "+fmtDate(v.date):""}.`, v.glow?"Glow: "+v.glow:"", v.wonder?"Wonder: "+v.wonder:"",
    seenList.length?"Seen during the visit: "+seenList.join(", ")+".":"",
    (v.followUp||[]).length?"Teacher requested: "+v.followUp.join(", ")+".":""].filter(Boolean).join("\n");
  if(v.next) p.nextStep=v.next;
  dirty=true; view="form"; render(); window.scrollTo(0,0); flush(); toast("Preconference started from the walk");
}
function walkTrends(list){
  const walks=list.filter(r=>r.form==="walk"); if(!walks.length) return null;
  const items=WALK_ITEMS.map(i=>{let y=0,n=0;walks.forEach(w=>{const s=(w.values.seen||{})[i.k];if(s==="yes")y++;if(s)n++});return {i,y,n,p:n?Math.round(100*y/n):null}});
  const big=["Teacher Clarity","Classroom Discussion"].map(b=>{let y=0,n=0;items.filter(x=>x.i.big3===b).forEach(x=>{y+=x.y;n+=x.n});return {b,p:n?Math.round(100*y/n):null}});
  const eng=[];walks.forEach(w=>["s1","s2"].forEach(k=>{const q=pct(w.values[k+"e"],w.values[k+"n"]);if(q!==null)eng.push(q)}));
  const fu={};walks.forEach(w=>(w.values.followUp||[]).forEach(f=>fu[f]=(fu[f]||0)+1));
  const ds=walks.map(recISO).sort();
  return {count:walks.length,items,big,eng:eng.length?Math.round(eng.reduce((a,b)=>a+b,0)/eng.length):null,fu,from:ds[0],to:ds[ds.length-1]};
}
function trendsHTML(t){
  if(!t) return "";
  return `<div class="trends"><h3>Eagle Eyes school-wide trends</h3><p class="note" style="margin-top:0">${t.count} walk${t.count>1?"s":""}${t.from?`, ${fmtDate(t.from)}${t.to!==t.from?" to "+fmtDate(t.to):""}`:""}. No teacher names, so you can share this with leadership or use it to plan PL.</p>
  ${t.big.map(b=>`<div class="trow"><b>Big 3: ${esc(b.b)}</b><div class="tbar"><i style="width:${b.p||0}%"></i></div><span>${b.p===null?"-":b.p+"%"}</span></div>`).join("")}
  <div class="trow"><b>Average engagement</b><div class="tbar"><i style="width:${t.eng||0}%"></i></div><span>${t.eng===null?"-":t.eng+"%"}</span></div>
  <div class="clab">Look-fors seen (share of walks where marked)</div>
  ${t.items.map(x=>`<div class="trow"><span>${esc(x.i.sdi)}</span><div class="tbar"><i style="width:${x.p||0}%"></i></div><span>${x.p===null?"-":`${x.p}% (${x.y}/${x.n})`}</span></div>`).join("")}
  ${Object.keys(t.fu).length?`<p class="note">Follow-up requested: ${Object.entries(t.fu).map(([k,n])=>`${esc(k)} (${n})`).join(", ")}</p>`:""}
  <div class="aibar"><button class="btn small" data-act="trendsPdf">Download trends PDF</button></div></div>`;
}
async function trendsPdf(){
  const t=walkTrends(filtered()); if(!t) return;
  if(!window.jspdf){toast("The PDF tool didn't load. Check your connection and reload.");return}
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"letter"}); const M=40, W=doc.internal.pageSize.getWidth();
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(...INK);doc.text("Eagle Eyes Learning Walks: School-wide Trends",M,M+12);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...SOFT);
  doc.text(`T.W. Josey High School. ${t.count} walk${t.count>1?"s":""}${t.from?", "+fmtDate(t.from)+(t.to!==t.from?" to "+fmtDate(t.to):""):""}. Non-evaluative; no teacher names.`,M,M+30);
  doc.setDrawColor(...GOLD);doc.setLineWidth(2);doc.line(M,M+40,W-M,M+40);
  const st={theme:"grid",margin:{left:M,right:M},styles:{fontSize:10,cellPadding:6,textColor:INK},headStyles:{fillColor:FILL,textColor:INK,fontStyle:"bold"}};
  doc.autoTable({...st,startY:M+54,head:[["Summary","Result"]],body:[...t.big.map(b=>["Big 3: "+b.b+" (look-fors seen)",b.p===null?"-":b.p+"%"]),["Average engagement (head counts)",t.eng===null?"-":t.eng+"%"]]});
  doc.autoTable({...st,startY:doc.lastAutoTable.finalY+14,head:[["Look-for","SDI indicator","Seen","Walks marked"]],body:t.items.map(x=>[x.i.sdi,"#"+x.i.sn+(x.i.big3?" (Big 3: "+x.i.big3+")":""),x.p===null?"-":x.p+"%",String(x.n)])});
  if(Object.keys(t.fu).length) doc.autoTable({...st,startY:doc.lastAutoTable.finalY+14,head:[["Follow-up requested by teachers","Count"]],body:Object.entries(t.fu).map(([k,n])=>[k,String(n)])});
  await saveFile(`Eagle Eyes trends - ${t.from||""}${t.to&&t.to!==t.from?" to "+t.to:""}.pdf`.replace(/[\\/:*?"<>|]+/g,"-"),doc.output("blob"),"Trends PDF saved");
}

async function restoreBackup(file){
  if(!file) return;
  try{ const data=JSON.parse(await file.text()); const list=Array.isArray(data)?data:data.records;
    if(!Array.isArray(list)) throw 0;
    const o=lsRead(); let n=0;
    list.forEach(r=>{ if(r&&r.id&&FORM[r.form]&&r.values){ if(!o[r.id]||(o[r.id].updatedAt||0)<(r.updatedAt||0)){o[r.id]=r;n++} } });
    if(!lsWrite(o)){toast("Browser storage is full. Delete some forms and try again.");return}
    if(data.name&&!myName()){try{localStorage.setItem(NAMEKEY,data.name)}catch{}}
    emitLocal(); renderSaved(); toast(`Restored ${n} form${n===1?"":"s"}`);
  }catch{ toast("That file isn't a Coaching Toolkit backup."); }
}

/* ---------- PDF ---------- */
const INK=[28,43,57], SOFT=[90,105,120], GOLD=[224,162,26], FILL=[238,242,245];
function fmtTime(t){const m=/^(\d{2}):(\d{2})/.exec(t||"");if(!m)return t||"";let h=+m[1];const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${m[2]} ${ap}`}
function show(f,val){ if(f.input==="date"||f.input==="datetime-local") return fmtDate(val); if(f.input==="time") return fmtTime(val); return val||""; }
function buildPdf(r,doc){
  const {jsPDF}=window.jspdf; const f=FORM[r.form], v=r.values||{}, orient=f.landscape?"landscape":"portrait";
  if(doc) doc.addPage("letter",orient); else doc=new jsPDF({unit:"pt",format:"letter",orientation:orient});
  const first=doc.getNumberOfPages();
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=40, CW=W-2*M;
  let y=M;
  const ensure=h=>{ if(y+h>H-M-24){doc.addPage();y=M} };
  const base={theme:"grid",margin:{left:M,right:M,bottom:M+20},styles:{fontSize:9.5,cellPadding:5,textColor:INK,lineColor:[180,190,200],lineWidth:.6,valign:"top",overflow:"linebreak"},headStyles:{fillColor:FILL,textColor:INK,fontStyle:"bold"}};
  const table=opts=>{doc.autoTable({...base,startY:y,...opts});y=doc.lastAutoTable.finalY+10};

  doc.setFont("helvetica","bold");doc.setFontSize(f.landscape?16:15);doc.setTextColor(...INK);
  const tl=doc.splitTextToSize(f.title,CW);doc.text(tl,M,y+12);y+=12+tl.length*17-10;
  if(f.subtitle){doc.setFont("helvetica","italic");doc.setFontSize(9.5);doc.setTextColor(...SOFT);doc.text(f.subtitle,M,y+8);y+=14}
  doc.setDrawColor(...GOLD);doc.setLineWidth(2);doc.line(M,y+2,W-M,y+2);y+=16;

  const lb=l=>/[?:]$/.test(l)?l:l+":";
  const draw=b=>{
    if(b.type==="fields"){
      const long=b.fields.some(x=>x.input==="textarea");
      if(b.cols===2&&!long){ const body=[];for(let i=0;i<b.fields.length;i+=2){const a=b.fields[i],c=b.fields[i+1];body.push([lb(a.label),show(a,v[a.key]),c?lb(c.label):"",c?show(c,v[c.key]):""])}
        table({body,columnStyles:{0:{fontStyle:"bold",fillColor:FILL,cellWidth:CW*.2},1:{cellWidth:CW*.3},2:{fontStyle:"bold",fillColor:FILL,cellWidth:CW*.2},3:{cellWidth:CW*.3}}}); }
      else table({body:b.fields.map(x=>[lb(x.label),show(x,v[x.key])]),columnStyles:{0:{fontStyle:"bold",fillColor:FILL,cellWidth:CW*.32}},bodyStyles:{minCellHeight:long?34:0}});
    }
    else if(b.type==="textarea"){ const lab=b.label===undefined?NOTES:b.label; table({head:lab?[[lab]]:undefined,body:[[v[b.key]||""]],bodyStyles:{minCellHeight:44}}); }
    else if(b.type==="note"){ doc.setFont("helvetica","italic");doc.setFontSize(9);doc.setTextColor(...SOFT);const l=doc.splitTextToSize(b.text,CW);ensure(l.length*11+6);doc.text(l,M,y+8);y+=l.length*11+8; }
    else if(b.type==="checks"){ const sel=v[b.key]||[];doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(...INK);
      if(b.showLabel){doc.setFont("helvetica","bold");ensure(28);doc.text(lb(b.label),M,y+9);y+=13;doc.setFont("helvetica","normal");}
      let txt=b.options.map(o=>`[${sel.includes(o)?"X":"  "}] ${o}${o==="Other"&&b.other&&v[b.other]?": "+v[b.other]:""}`).join("     ");
      const l=doc.splitTextToSize(txt,CW);ensure(l.length*13+6);doc.text(l,M,y+9);y+=l.length*13+8; }
    else if(b.type==="grid"){ const rows=(v[b.key]||[]).filter((rw,i)=>!b.dynamic||Object.values(rw).some(Boolean)||i<3);
      const head=[[...(b.rowLabels?[b.labelHead]:[]),...b.columns.map(c=>c.label)]];
      const body=rows.map((rw,i)=>[...(b.rowLabels?[b.rowLabels[i]]:[]),...b.columns.map(c=>show(c,rw[c.key]))]);
      const cs={};if(b.rowLabels)cs[0]={cellWidth:38,halign:"center",fontStyle:"bold"};
      table({head,body,columnStyles:cs,bodyStyles:{minCellHeight:b.rows===1?60:28}}); }
    else if(b.type==="ratings"){ const r=v.ratings||{},ev=v.evidence||{};
      table({head:[["#","Structure Indicator","Look Fors","Rating","Evidence / Notes"]],body:SDI.map(i=>[String(i.n),`${i.code}: ${i.title}`,i.look,r[i.n]?`${r[i.n]} - ${SCALE_LABEL[r[i.n]]}`:"",ev[i.n]||""]),
        columnStyles:{0:{cellWidth:24,halign:"center",fontStyle:"bold"},1:{cellWidth:CW*.27,fontStyle:"bold"},2:{cellWidth:CW*.3,fontSize:8.5,textColor:SOFT},3:{cellWidth:78}}}); }
    else if(b.type==="coteach"){ const c=v.coteach||{};
      if(!Object.values(c).some(Boolean)) draw({type:"note",text:"No co-teacher present."});
      else table({head:[["Model","Description","Rating"]],body:COTEACH.map(([k,n,d])=>[`${k}. ${n}`,d,c[k]||""]),columnStyles:{0:{cellWidth:130,fontStyle:"bold"},2:{cellWidth:60,halign:"center"}}}); }
    else if(b.type==="growth"){ const g=growthList(v),s=strengthList(v),st=v.strategies||{},nx=v.nextSteps||{},r=v.ratings||{};
      if(s.length) table({head:[["Strengths (rated 3 or 4)"]],body:[[s.map(i=>`#${i.n} ${i.short}: ${SCALE_LABEL[r[i.n]]}`).join("\n")]]});
      if(!g.length) draw({type:"note",text:"No indicators rated 1 or 2."});
      g.forEach(i=>{ensure(90);table({head:[[`#${i.n} ${i.short}: rated ${r[i.n]} (${SCALE_LABEL[r[i.n]]})`]],rowPageBreak:"avoid",body:[["Recommended strategies:\n"+((st[i.n]||[]).map(x=>"- "+x).join("\n")||"None selected")+"\n\nCoaching next step: "+(nx[i.n]||"")]]})}); }
    else if(b.type==="walkLooks"){ const seen=v.seen||{},ev=v.wev||{}; const body=[];
      WALK.forEach(g=>{body.push([{content:g.group,colSpan:3,styles:{fillColor:FILL,fontStyle:"bold"}}]);
        g.items.forEach(i=>body.push([`${i.text}\nSDI #${i.sn}: ${i.sdi}${i.big3?"  |  Big 3: "+i.big3:""}`,seen[i.k]==="yes"?"Yes":seen[i.k]==="no"?"Not this visit":"",ev[i.k]||""]))});
      table({head:[["Look-For","Seen?","What I saw or heard"]],body,columnStyles:{0:{cellWidth:CW*.42},1:{cellWidth:70}}}); }
    else if(b.type==="scan"){ const f=(a,n)=>v[a]||v[n]?`${v[a]||"__"} engaged of ${v[n]||"__"} students${pct(v[a],v[n])!==null?" ("+pct(v[a],v[n])+"%)":""}`:"";
      table({body:[["Scan 1 (first few minutes)",f("s1e","s1n")],["Scan 2 (near the end of the visit)",f("s2e","s2n")]],columnStyles:{0:{fontStyle:"bold",fillColor:FILL,cellWidth:CW*.35}}}); }
    else if(b.type==="walkTools"){}
    else if(b.type==="summary"){ table({body:[[v.summary||""]],bodyStyles:{minCellHeight:60}}); }
    else if(b.type==="section"){ ensure(70);
      doc.setFont("helvetica","bold");doc.setFontSize(11.5);doc.setTextColor(...INK);
      const h=(b.n?b.n+". ":"")+b.title.toUpperCase()+(b.sub?" - "+b.sub:"");doc.text(h,M,y+10);y+=16;
      doc.setDrawColor(...GOLD);doc.setLineWidth(1);doc.line(M,y-2,M+60,y-2);y+=4;
      if(b.prompts){doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...SOFT);
        b.prompts.forEach(p=>{const l=doc.splitTextToSize("•  "+p,CW-10);ensure(l.length*11);doc.text(l,M+4,y+8);y+=l.length*11});y+=6;}
      b.blocks.forEach(draw); }
  };
  f.blocks.forEach(draw);
  if(f.attribution){doc.setFont("helvetica","italic");doc.setFontSize(8.5);doc.setTextColor(...SOFT);ensure(14);doc.text(f.attribution,M,y+8)}
  const last=doc.getNumberOfPages(), n=last-first+1, who=r.form==="log"?(v.period||""):(v.teacher||"");
  for(let i=first;i<=last;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...SOFT);
    doc.text(f.title+(who?"  |  "+who:""),M,H-22);doc.text(`Page ${i-first+1} of ${n}`,W-M,H-22,{align:"right"});}
  doc.setPage(last);
  return doc;
}
function pdfName(r){const f=FORM[r.form],v=r.values||{};const who=r.form==="log"?(v.period||"log"):(v.teacher||"teacher");
  const d=(f.dateKey&&v[f.dateKey]||"").slice(0,10)||new Date(r.updatedAt).toISOString().slice(0,10);
  return `${f.short} - ${who} - ${d}.pdf`.replace(/[\\/:*?"<>|]+/g,"-");}
async function drivePdf(r){
  if(!window.jspdf){toast("The PDF tool didn't load. Check your connection and reload.");return}
  let blob; try{blob=buildPdf(r).output("blob")}catch(e){toast("Couldn't build the PDF.");return}
  await saveToDrive(pdfName(r),blob);
}
async function downloadPdf(r){
  if(!window.jspdf){toast("The PDF tool didn't load. Check your connection and reload.");return}
  let blob; try{blob=buildPdf(r).output("blob")}catch(e){toast("Couldn't build the PDF.");return}

/* ---------- Google Drive ---------- */
const DRIVE="Google Drive"; let driveBusy=false;
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function driveErr(e){const c=e&&e.code;
  if(c==="needs_reauth") return "Google Drive needs to be reconnected. Reconnect it in claude.ai Settings, Connectors, then try again.";
  if(c==="server_not_connected"||c==="server_not_found") return "Google Drive isn't connected. Add it in claude.ai Settings, Connectors, then try again.";
  if(c==="selection_required") return "Choose which Google Drive account to use when Claude asks, then try again.";
  if(c==="not_in_manifest"||c==="not_granted") return "Google Drive access is turned off for this page. Allow it when prompted to save files.";
  if(c==="blocked_by_policy"||c==="approval_required") return "Your organization's settings don't allow saving to Google Drive from here.";
  if(c==="tool_error") return "Google Drive couldn't save the file: "+(e.message||"unknown error");
  if(c==="cancelled") return "";
  return "Google Drive didn't confirm the save. Check your Coaching Toolkit folder before trying again so you don't create a duplicate.";
}
function driveBanner(html){let b=$("#driveMsg");if(!b){b=document.createElement("div");b.id="driveMsg";b.className="drivemsg";document.body.appendChild(b)}
  b.innerHTML=html+`<button class="xbtn" aria-label="Dismiss" onclick="this.parentNode.remove()">×</button>`;clearTimeout(driveBanner._t);driveBanner._t=setTimeout(()=>b.remove(),12000)}
async function saveToDrive(filename,blob){
  if(driveBusy){toast("Still saving the last file…");return}
  const mcp=await mcpP; if(!mcp){toast("Saving to Google Drive isn't available in this view.");return}
  driveBusy=true; toast("Saving to Google Drive…");
  try{
    const st=await storeP; const cfg=await st.getSettings();
    let folderId=cfg.driveFolderId, folderUrl=cfg.driveFolderUrl;
    if(!folderId){
      const f=(await mcp.callTool(DRIVE,"create_file",{title:"Coaching Toolkit",contentMimeType:"application/vnd.google-apps.folder"})).payload||{};
      if(!f.id) throw {code:"tool_error",message:"the folder couldn't be created"};
      folderId=f.id; folderUrl=f.viewUrl||""; await st.setSettings({...cfg,driveFolderId:folderId,driveFolderUrl:folderUrl});
    }
    const b64=await blobToB64(blob);
    let file;
    try{ file=(await mcp.callTool(DRIVE,"create_file",{title:filename,base64Content:b64,contentMimeType:"application/pdf",disableConversionToGoogleType:true,parentId:folderId})).payload||{}; }
    catch(e){ if(e&&e.code==="tool_error"&&/not ?found|parent|404/i.test(e.message||"")){ await st.setSettings({...cfg,driveFolderId:"",driveFolderUrl:""}); throw {code:"tool_error",message:"the Coaching Toolkit folder wasn't found (it may have been moved or deleted). Click Save to Drive again to create a new one."}; } throw e; }
    const link=file.viewUrl||folderUrl;
    driveBanner(`Saved <b>${esc(filename)}</b> to your Coaching Toolkit folder in Google Drive.${link?` <a href="${esc(link)}" target="_blank" rel="noopener">Open in Drive</a>`:""}`);
  }catch(e){ const m=driveErr(e); if(m) driveBanner(esc(m)); }
  finally{ driveBusy=false; }
}

async function saveFile(filename,blob,okMsg){
  const dl=await downloadsP;
  if(!dl){ try{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(okMsg)}catch{toast("Couldn't save the file.")} return; }
  try{await dl.save({filename,data:blob});toast(okMsg)}
  catch(e){ if(e&&e.code==="declined")return; toast(e&&e.code==="rate_limited"?"A save prompt is already open.":"Couldn't save the file. Try again."); }
}
function bundleName(list,ext){
  const teachers=[...new Set(list.map(r=>r.values?.teacher).filter(Boolean))];
  const who=teachers.length===1?teachers[0]:"All teachers";
  const ds=list.map(recISO).sort(); const range=ds[0]===ds[ds.length-1]?ds[0]:`${ds[0]} to ${ds[ds.length-1]}`;
  return `Coaching forms - ${who} - ${range}.${ext}`.replace(/[\\/:*?"<>|]+/g,"-");
}
async function downloadAll(kind){
  const list=filtered().slice().sort((a,b)=>recISO(a).localeCompare(recISO(b))||a.form.localeCompare(b.form));
  if(!list.length) return;
  if(!window.jspdf||(kind==="zip"&&!window.JSZip)){toast("The download tools didn't load. Check your connection and reload.");return}
  if(kind!=="drive") toast(`Building ${list.length} form${list.length>1?"s":""}…`);
  try{
    if(kind==="pdf"||kind==="drive"){ let doc=null; for(const r of list) doc=buildPdf(r,doc);
      if(kind==="drive") await saveToDrive(bundleName(list,"pdf"),doc.output("blob"));
      else await saveFile(bundleName(list,"pdf"),doc.output("blob"),"PDF saved"); }
    else { const zip=new JSZip(), used={};
      for(const r of list){ let n=pdfName(r); if(used[n]){used[n]++;n=n.replace(/\.pdf$/,` (${used[n]}).pdf`)} else used[n]=1; zip.file(n,buildPdf(r).output("arraybuffer")); }
      await saveFile(bundleName(list,"zip"),await zip.generateAsync({type:"blob"}),"Zip saved"); }
  }catch(e){toast("Couldn't build the download. Try fewer forms at a time.")}
}

/* ---------- start ---------- */
newRecord("pre"); render();
</script>
</body>
</html>
